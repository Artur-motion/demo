function hid(){try{return JSON.parse(localStorage.getItem('vid-hidden')||'{}')}catch(e){return {}}}
function setHid(h){try{localStorage.setItem('vid-hidden',JSON.stringify(h))}catch(e){}}
function sent(){try{return JSON.parse(localStorage.getItem('vid-sent')||'{}')}catch(e){return {}}}
function setSent(h){try{localStorage.setItem('vid-sent',JSON.stringify(h))}catch(e){}}
function msg(it){return 'Здравствуйте! Записал, как сайт «'+it.name+'» выглядит у гостя на телефоне. Если что-то поменять — напишите, сделаю в тот же день.\nСайт: '+it.url}
var showAll=false;
function render(){
  var h=hid(), s=sent(), L=document.getElementById('list'); L.innerHTML='';

    c.querySelector('.top .meta').textContent=(it.w?'волна '+it.w:'пачка 1')+(s[it.code]?' · отправлено':'');
    c.querySelector('.city').textContent=it.city;
    c.querySelector('.text').textContent=msg(it);
    if(it.wa){c.querySelector('.chat').href='https://wa.me/'+it.wa;c.querySelector('.tg').href='https://t.me/+'+it.wa;}
    else{c.querySelector('.chat').remove();c.querySelector('.tg').remove();}
    c.querySelector('.see').href='../v/'+it.code+'.mp4';
    var hb=c.querySelector('.hide'); hb.textContent=h[it.code]?'Вернуть':'Убрать (ответил)';
    hb.onclick=function(){var x=hid(); if(x[it.code])delete x[it.code]; else x[it.code]=1; setHid(x); render();};
    var st=c.querySelector('.state'), b=c.querySelector('.send'), file=null;
    c.querySelector('.copy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(msg(it)).then(function(){st.textContent='Текст скопирован'},function(){st.textContent='Не скопировалось — выделите текст выше'})};
    b.onclick=function(){
      if(!file){

          file=new File([bl],it.name.replace(/[^\wА-Яа-яЁё ]+/g,'').trim()+'.mp4',{type:'video/mp4'});
          b.disabled=false;
          if(navigator.canShare&&navigator.canShare({files:[file]})){b.classList.add('ready');b.textContent='Готово — нажмите, чтобы отправить';st.textContent=(bl.size/1048576).toFixed(1)+' МБ';}
          else{st.textContent='Этот браузер не умеет делиться файлом. Откройте страницу в Chrome или нажмите «Видео» и сохраните.';}
        }).catch(function(e){b.disabled=false;st.textContent='Не загрузилось ('+e.message+'), попробуйте ещё раз';});
        return;
      }
      navigator.share({files:[file],text:msg(it)}).then(function(){var x=sent();x[it.code]=1;setSent(x);render();}).catch(function(e){st.textContent=e.name==='AbortError'?'Отменено':'Ошибка: '+e.message;});
    };
    L.appendChild(c);
  });
}
document.getElementById('showAll').onclick=function(){showAll=!showAll;this.textContent=showAll?'Спрятать скрытых':'Показать скрытых';render();};
window.addEventListener('hashchange',render);
render();
</script></body></html>
